<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="¿Qué complejidad tiene Myers y de qué depende?">
<title>¿Qué complejidad tiene Myers y de qué depende?</title>
<rect x="0" y="0" width="512" height="512" fill="#1a0b2e"/>
<ellipse cx="44.34" cy="382.66" rx="85.12" ry="85.12" fill="hsl(45 90% 58% / 0.225)"/>
<ellipse cx="273.73" cy="265.22" rx="168.01" ry="168.01" fill="hsl(45 90% 58% / 0.157)"/>
<ellipse cx="149.05" cy="167.04" rx="77.27" ry="77.27" fill="hsl(45 90% 58% / 0.185)"/>
<ellipse cx="148.88" cy="107.79" rx="187.28" ry="187.28" fill="hsl(45 90% 58% / 0.216)"/>
<rect x="146" y="110" width="220" height="40" rx="20" fill="rgba(57, 255, 20, 0.1)" stroke="#00ffcc" stroke-width="2"/>
<text x="256" y="130" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#00ffcc">O((N+D)·D)</text>
<rect x="60" y="229" width="160" height="42" rx="10" fill="rgba(255, 0, 127, 0.1)" stroke="#8a7fb5" stroke-width="2"/>
<text x="140" y="250" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#f1f1f1">N = tamaño</text>
<rect x="287" y="229" width="170" height="42" rx="10" fill="rgba(255, 0, 127, 0.1)" stroke="#ff007f" stroke-width="2"/>
<text x="372" y="250" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#f1f1f1">D = distancia</text>
<line x1="256" y1="300" x2="256" y2="349.2" stroke="#ffcc00" stroke-width="2" stroke-linecap="round"/>
<polygon points="256,360 249.57,349.87 262.43,349.87" fill="#ffcc00"/>
<text x="256" y="390" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#f1f1f1">archivos casi iguales: D chico, diff casi lineal</text>
<text x="256" y="460" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#8a7fb5">la edición manda, no el tamaño</text>
</svg>
