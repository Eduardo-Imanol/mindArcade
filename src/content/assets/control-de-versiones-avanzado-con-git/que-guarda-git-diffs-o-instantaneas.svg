<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="¿Qué guarda Git: diffs o instantáneas?">
<title>¿Qué guarda Git: diffs o instantáneas?</title>
