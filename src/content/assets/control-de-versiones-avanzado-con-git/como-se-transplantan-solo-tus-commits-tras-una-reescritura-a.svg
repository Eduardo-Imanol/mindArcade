<ellipse cx="170.52" cy="52.81" rx="154.29" ry="154.29" fill="hsl(120 90% 58% / 0.236)"/>
<ellipse cx="459.92" cy="457.61" rx="161.79" ry="161.79" fill="hsl(120 90% 58% / 0.158)"/>
