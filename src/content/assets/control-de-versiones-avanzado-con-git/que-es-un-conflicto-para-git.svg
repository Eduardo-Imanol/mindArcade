<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="¿Qué es un conflicto para Git?">
<title>¿Qué es un conflicto para Git?</title>
<rect x="0" y="0" width="512" height="512" fill="#1a0b2e"/>
<ellipse cx="115.32" cy="141.89" rx="188.21" ry="188.21" fill="hsl(120 90% 58% / 0.221)"/>
<ellipse cx="208.45" cy="465.23" rx="90.19" ry="90.19" fill="hsl(120 90% 58% / 0.239)"/>
<ellipse cx="459.82" cy="202.74" rx="181.15" ry="181.15" fill="hsl(120 90% 58% / 0.158)"/>
<ellipse cx="432.36" cy="394" rx="159.4" ry="159.4" fill="hsl(120 90% 58% / 0.164)"/>
<rect x="90" y="110" width="332" height="44" rx="8" fill="rgba(0, 255, 204, 0.07)" stroke="#00ffcc" stroke-width="2"/>
<line x1="98" y1="118" x2="414" y2="118" stroke="#00ffcc" stroke-width="2" stroke-linecap="round"/>
<text x="256" y="136" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#f1f1f1">&lt;&lt;&lt;&lt;&lt;&lt;&lt; ours</text>
<rect x="90" y="162" width="332" height="44" rx="8" fill="rgba(0, 255, 204, 0.07)" stroke="#ffcc00" stroke-width="2"/>
<line x1="98" y1="170" x2="414" y2="170" stroke="#ffcc00" stroke-width="2" stroke-linecap="round"/>
<text x="256" y="188" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#f1f1f1">=======</text>
<rect x="90" y="214" width="332" height="44" rx="8" fill="rgba(0, 255, 204, 0.07)" stroke="#ff007f" stroke-width="2"/>
<line x1="98" y1="222" x2="414" y2="222" stroke="#ff007f" stroke-width="2" stroke-linecap="round"/>
<text x="256" y="240" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#f1f1f1">&gt;&gt;&gt;&gt;&gt;&gt;&gt; theirs</text>
<text x="256" y="330" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#f1f1f1">la región tiene dos dueños</text>
<text x="256" y="420" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#8a7fb5">no es un error de Git: es un empate</text>
<text x="256" y="460" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#8a7fb5">la decisión es humana</text>
</svg>
