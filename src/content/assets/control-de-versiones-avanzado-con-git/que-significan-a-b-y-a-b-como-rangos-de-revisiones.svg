<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="¿Qué significan A..B y A...B como rangos de revisiones?">
<title>¿Qué significan A..B y A...B como rangos de revisiones?</title>
<rect x="0" y="0" width="512" height="512" fill="#1a0b2e"/>
<ellipse cx="465.54" cy="298.32" rx="101.77" ry="101.77" fill="hsl(45 90% 58% / 0.174)"/>
<ellipse cx="442.8" cy="439.27" rx="157.29" ry="157.29" fill="hsl(45 90% 58% / 0.154)"/>
<ellipse cx="323.68" cy="321.2" rx="151.87" ry="151.87" fill="hsl(45 90% 58% / 0.19)"/>
<ellipse cx="291.82" cy="153.4" rx="186.6" ry="186.6" fill="hsl(45 90% 58% / 0.187)"/>
<rect x="60" y="150" width="100" height="70" rx="12" fill="rgba(15, 5, 29, 0.55)" stroke="#00ffcc" stroke-width="2.5"/>
<text x="74" y="168" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#00ffcc">A</text>
<rect x="352" y="150" width="100" height="70" rx="12" fill="rgba(15, 5, 29, 0.55)" stroke="#00ffcc" stroke-width="2.5"/>
<text x="366" y="168" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#00ffcc">B</text>
<ellipse cx="217.5" cy="185" rx="4" ry="4" fill="#8a7fb5"/>
<ellipse cx="255" cy="185" rx="4" ry="4" fill="#8a7fb5"/>
<ellipse cx="292.5" cy="185" rx="4" ry="4" fill="#8a7fb5"/>
<rect x="116" y="260" width="280" height="40" rx="20" fill="rgba(57, 255, 20, 0.1)" stroke="#ffcc00" stroke-width="2"/>
<text x="256" y="280" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#ffcc00">A..B  = en B, no en A</text>
<rect x="131" y="330" width="250" height="40" rx="20" fill="rgba(57, 255, 20, 0.1)" stroke="#39ff14" stroke-width="2"/>
<text x="256" y="350" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#39ff14">A...B = simétrica</text>
<text x="256" y="430" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#8a7fb5">diferencia vs diferencia simétrica</text>
<text x="256" y="465" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#8a7fb5">tres puntos: cada lado menos la base</text>
</svg>
