<text x="256" y="200" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#ff007f">rebase -i --autosquash</text>
<line x1="256" y1="222" x2="256" y2="254.2" stroke="#ff007f" stroke-width="2" stroke-linecap="round"/>
<polygon points="256,265 249.57,254.87 262.43,254.87" fill="#ff007f"/>
