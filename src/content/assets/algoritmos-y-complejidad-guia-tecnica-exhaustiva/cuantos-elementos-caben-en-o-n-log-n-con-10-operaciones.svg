<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="¿Cuántos elementos caben en O(n log n) con 10⁸ operaciones?">
<title>¿Cuántos elementos caben en O(n log n) con 10⁸ operaciones?</title>
<rect x="0" y="0" width="512" height="512" fill="#1a0b2e"/>
<ellipse cx="142.85" cy="96.52" rx="156.87" ry="156.87" fill="hsl(120 90% 58% / 0.168)"/>
<ellipse cx="388.61" cy="112.69" rx="177.26" ry="177.26" fill="hsl(120 90% 58% / 0.186)"/>
<ellipse cx="441.6" cy="55.57" rx="111.61" ry="111.61" fill="hsl(120 90% 58% / 0.199)"/>
<ellipse cx="85.38" cy="369.29" rx="157.69" ry="157.69" fill="hsl(120 90% 58% / 0.2)"/>
<rect x="75" y="180" width="170" height="40" rx="20" fill="rgba(57, 255, 20, 0.1)" stroke="#00ffcc" stroke-width="2"/>
<text x="160" y="200" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#00ffcc">10⁸ ops</text>
<line x1="250" y1="200" x2="289.2" y2="200" stroke="#39ff14" stroke-width="2" stroke-linecap="round"/>
<polygon points="300,200 289.87,206.43 289.87,193.57" fill="#39ff14"/>
<rect x="315" y="180" width="150" height="40" rx="20" fill="rgba(57, 255, 20, 0.1)" stroke="#39ff14" stroke-width="2"/>
<text x="390" y="200" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#39ff14">n log n</text>
<text x="256" y="330" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="700" fill="#f1f1f1">≈ 4 a 5 millones</text>
<text x="256" y="400" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#8a7fb5">n² solo admitiría 10⁴</text>
</svg>
