<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="¿Qué valor tiene la suma armónica Hₙ?">
<title>¿Qué valor tiene la suma armónica Hₙ?</title>
<rect x="0" y="0" width="512" height="512" fill="#1a0b2e"/>
<ellipse cx="162.91" cy="499" rx="202.3" ry="202.3" fill="hsl(265 90% 58% / 0.153)"/>
<ellipse cx="375.92" cy="453.37" rx="144.8" ry="144.8" fill="hsl(265 90% 58% / 0.232)"/>
<ellipse cx="506.47" cy="328.96" rx="90.57" ry="90.57" fill="hsl(265 90% 58% / 0.192)"/>
<ellipse cx="471.28" cy="393.34" rx="87.93" ry="87.93" fill="hsl(265 90% 58% / 0.239)"/>
<rect x="90" y="150" width="332" height="110" rx="12" fill="rgba(15, 5, 29, 0.55)" stroke="#00ffcc" stroke-width="2.5"/>
<text x="104" y="168" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#00ffcc">Hₙ = Σ 1/i</text>
<rect x="161" y="290" width="190" height="40" rx="20" fill="rgba(57, 255, 20, 0.1)" stroke="#39ff14" stroke-width="2"/>
<text x="256" y="310" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#39ff14">ln n + γ</text>
<text x="256" y="370" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#8a7fb5">γ ≈ 0.5772</text>
<text x="256" y="420" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700" fill="#f1f1f1">es Θ(log n)</text>
</svg>
