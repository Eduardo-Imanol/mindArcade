<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="¿Cómo se dimensiona un filtro de Bloom?">
<title>¿Cómo se dimensiona un filtro de Bloom?</title>
<rect x="0" y="0" width="512" height="512" fill="#1a0b2e"/>
<ellipse cx="438.44" cy="429.97" rx="120.51" ry="120.51" fill="hsl(45 90% 58% / 0.237)"/>
<ellipse cx="241.24" cy="278.65" rx="175.44" ry="175.44" fill="hsl(45 90% 58% / 0.237)"/>
<ellipse cx="336.94" cy="19.69" rx="190.92" ry="190.92" fill="hsl(45 90% 58% / 0.166)"/>
<ellipse cx="135.8" cy="130.3" rx="108.14" ry="108.14" fill="hsl(45 90% 58% / 0.143)"/>
<rect x="86" y="125" width="340" height="70" rx="14" fill="rgba(0, 255, 204, 0.08)" stroke="#00ffcc" stroke-width="2.5"/>
<text x="256" y="160" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#f1f1f1">m = -n ln p / (ln 2)²</text>
<rect x="136" y="225" width="240" height="70" rx="14" fill="rgba(0, 255, 204, 0.08)" stroke="#00ffcc" stroke-width="2.5"/>
<text x="256" y="260" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#f1f1f1">k = m/n ln 2</text>
<text x="256" y="370" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#8a7fb5">p = prob falsos positivos</text>
</svg>
