<title>¿Qué complejidad tiene Dijkstra con un heap binario?</title>
<rect x="0" y="0" width="512" height="512" fill="#1a0b2e"/>
<ellipse cx="498.77" cy="349.45" rx="200.09" ry="200.09" fill="hsl(168 90% 58% / 0.224)"/>
<ellipse cx="510.99" cy="204.49" rx="99.94" ry="99.94" fill="hsl(168 90% 58% / 0.218)"/>
