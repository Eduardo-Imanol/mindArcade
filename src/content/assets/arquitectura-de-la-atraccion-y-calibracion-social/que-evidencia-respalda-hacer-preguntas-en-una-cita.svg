<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="¿Qué evidencia respalda hacer preguntas en una cita?">
<title>¿Qué evidencia respalda hacer preguntas en una cita?</title>
<rect x="0" y="0" width="512" height="512" fill="#1a0b2e"/>
<ellipse cx="145.31" cy="192.15" rx="175.46" ry="175.46" fill="hsl(265 90% 58% / 0.15)"/>
<ellipse cx="302.63" cy="88.58" rx="108.76" ry="108.76" fill="hsl(265 90% 58% / 0.187)"/>
<ellipse cx="24.96" cy="219.84" rx="191.56" ry="191.56" fill="hsl(265 90% 58% / 0.218)"/>
<ellipse cx="318.96" cy="378.03" rx="127.1" ry="127.1" fill="hsl(265 90% 58% / 0.219)"/>
<rect x="106" y="85" width="300" height="40" rx="20" fill="rgba(57, 255, 20, 0.1)" stroke="#00ffcc" stroke-width="2"/>
<text x="256" y="105" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#00ffcc">preguntar &gt; presumir</text>
<text x="256" y="175" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#f1f1f1">estudios de citas rápidas: quien pregunta</text>
<text x="256" y="210" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#f1f1f1">más, gusta más — y las preguntas</text>
<text x="256" y="245" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#f1f1f1">de seguimiento pesan doble</text>
<rect x="121" y="310" width="270" height="40" rx="20" fill="rgba(57, 255, 20, 0.1)" stroke="#ffcc00" stroke-width="2"/>
<text x="256" y="330" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#ffcc00">Huang et al. (Sölto?)</text>
<text x="256" y="375" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#8a7fb5">&quot;speed-dating&quot; 2017</text>
<text x="256" y="460" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#8a7fb5">interés genuino = imán conversacional</text>
