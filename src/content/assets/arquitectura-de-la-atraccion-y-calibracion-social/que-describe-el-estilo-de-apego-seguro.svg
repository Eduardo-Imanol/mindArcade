<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="¿Qué describe el estilo de apego seguro?">
<title>¿Qué describe el estilo de apego seguro?</title>
<rect x="0" y="0" width="512" height="512" fill="#1a0b2e"/>
<ellipse cx="49.79" cy="277.54" rx="101.28" ry="101.28" fill="hsl(120 90% 58% / 0.188)"/>
<ellipse cx="291.01" cy="249.72" rx="135.46" ry="135.46" fill="hsl(120 90% 58% / 0.228)"/>
<ellipse cx="448.56" cy="422.38" rx="74.5" ry="74.5" fill="hsl(120 90% 58% / 0.183)"/>
<ellipse cx="204.85" cy="3.56" rx="179.17" ry="179.17" fill="hsl(120 90% 58% / 0.175)"/>
<rect x="136" y="90" width="240" height="40" rx="20" fill="rgba(57, 255, 20, 0.1)" stroke="#39ff14" stroke-width="2"/>
<text x="256" y="110" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#39ff14">apego seguro</text>
<text x="256" y="180" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#f1f1f1">cercanía sin miedo</text>
<text x="256" y="225" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#f1f1f1">confía: &quot;si me alejo, no se rompe&quot;</text>
<text x="256" y="270" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#f1f1f1">pide ayuda sin vergüenza</text>
<text x="256" y="315" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#f1f1f1">discute sin amenazar el vínculo</text>
<text x="256" y="440" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#8a7fb5">~la mitad de la población</text>
</svg>
