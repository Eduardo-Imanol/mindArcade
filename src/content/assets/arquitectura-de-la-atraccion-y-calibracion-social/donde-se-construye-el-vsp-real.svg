<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="¿Dónde se construye el VSP real?">
<title>¿Dónde se construye el VSP real?</title>
<rect x="0" y="0" width="512" height="512" fill="#1a0b2e"/>
<ellipse cx="312.93" cy="459.5" rx="113.01" ry="113.01" fill="hsl(265 90% 58% / 0.202)"/>
<ellipse cx="388.82" cy="293.07" rx="101.54" ry="101.54" fill="hsl(265 90% 58% / 0.164)"/>
