<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="¿Qué es la compostura y qué la sabotea?">
<title>¿Qué es la compostura y qué la sabotea?</title>
<rect x="0" y="0" width="512" height="512" fill="#1a0b2e"/>
<ellipse cx="17.02" cy="277.46" rx="168.1" ry="168.1" fill="hsl(45 90% 58% / 0.234)"/>
<ellipse cx="392.82" cy="29.61" rx="127.45" ry="127.45" fill="hsl(45 90% 58% / 0.141)"/>
