<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="¿Qué describe el estilo de apego evitativo?">
<title>¿Qué describe el estilo de apego evitativo?</title>
<rect x="0" y="0" width="512" height="512" fill="#1a0b2e"/>
<ellipse cx="262.55" cy="91.5" rx="109.65" ry="109.65" fill="hsl(265 90% 58% / 0.172)"/>
<ellipse cx="205.91" cy="382.45" rx="80.9" ry="80.9" fill="hsl(265 90% 58% / 0.152)"/>
<ellipse cx="497.75" cy="147.05" rx="150.8" ry="150.8" fill="hsl(265 90% 58% / 0.21)"/>
<ellipse cx="501.39" cy="96.43" rx="151.46" ry="151.46" fill="hsl(265 90% 58% / 0.158)"/>
<rect x="131" y="90" width="250" height="40" rx="20" fill="rgba(57, 255, 20, 0.1)" stroke="#00ffcc" stroke-width="2"/>
<text x="256" y="110" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#00ffcc">apego evitativo</text>
<text x="256" y="180" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#f1f1f1">desactivación: distancia como calma</text>
<text x="256" y="225" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#f1f1f1">la intimidad siente invasión</text>
<text x="256" y="270" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#f1f1f1">valora autosuficiencia</text>
<text x="256" y="315" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#f1f1f1">se retira cuando hay conflicto</text>
<text x="256" y="440" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#8a7fb5">acercarse en pasos pequeños</text>
</svg>
